name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 3 * * *" # daily rebuild keeps GitHub stats fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build static site
        run: npm run build:static
        env:
          # Follows the repo owner (https://<owner>.github.io), so no edit is needed if the owner changes
          NEXT_PUBLIC_SITE_URL: https://${{ github.repository_owner }}.github.io
          # Raises the GitHub API rate limit for the dashboard data
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Optional analytics — add as a repository variable to enable
          NEXT_PUBLIC_POSTHOG_KEY: ${{ vars.NEXT_PUBLIC_POSTHOG_KEY }}

      - uses: actions/upload-pages-artifact@v4
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
